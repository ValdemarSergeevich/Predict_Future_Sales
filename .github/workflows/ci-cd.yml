name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: valdemarsergeevich/predict_future_sales

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.5'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Download CSV from Google Drive
      env:
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        mkdir -p data
        curl -L -o data/df_final1.csv "https://drive.google.com/uc?export=download&id=${GOOGLE_DRIVE_FILE_ID}"

    - name: Run tests
      run: |
        if [ -d "tests" ]; then
          python -m pytest tests/
        else
          echo "Warning: No tests directory found, skipping..."
        fi

    - name: Upload data artifact
      uses: actions/upload-artifact@v4
      with:
        name: data-csv
        path: data/df_final1.csv

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_lc: ${{ steps.norm.outputs.IMAGE_NAME_LC }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download data artifact
      uses: actions/download-artifact@v4
      with:
        name: data-csv
        path: data/

    - name: Normalize image name
      id: norm
      run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.norm.outputs.IMAGE_NAME_LC }}:latest
          ${{ env.REGISTRY }}/${{ steps.norm.outputs.IMAGE_NAME_LC }}:${{ github.sha }}

