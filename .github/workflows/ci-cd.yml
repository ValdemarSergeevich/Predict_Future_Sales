name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.5'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip [cite: 3]
        pip install -r requirements.txt [cite: 3]
        pip install pytest pytest-cov [cite: 3]

    - name: Download CSV from Google Drive
      env:
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
      run: |
        mkdir -p data [cite: 4]
        curl -L -o data/df_final1.csv "https://drive.google.com/uc?export=download&id=${GOOGLE_DRIVE_FILE_ID}" [cite: 4]

    - name: Run tests
      run: |
        # [FIX] Убрано "|| echo", чтобы падение тестов ПРЕРЫВАЛО пайплайн (тесты должны работать) 
        if [ -d "tests" ]; then
          python -m pytest tests/
        else
          echo "Warning: No tests directory found, skipping..."
        fi

    - name: Upload data artifact
      uses: actions/upload-artifact@v4
      with:
        name: data-csv
        path: data/df_final1.csv

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      [cite_start]uses: actions/checkout@v4

    - name: Download data artifact
      uses: actions/download-artifact@v4
      with:
        name: data-csv
        path: data/

    - name: Normalize image name
      id: norm
      run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to Container Registry
      [cite_start]uses: docker/login-action@v3 
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      [cite_start]uses: docker/build-push-action@v5 
      with:
        context: .
        [cite_start]push: true [cite: 10]
        tags: |
          ${{ env.REGISTRY }}/${{ steps.norm.outputs.IMAGE_NAME_LC }}:latest [cite: 11]
          ${{ env.REGISTRY }}/${{ steps.norm.outputs.IMAGE_NAME_LC }}:${{ github.sha }} [cite: 11]

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to server
      [cite_start]uses: appleboy/ssh-action@v1.0.3 
      env:
        GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        IMAGE_NAME_LC: ${{ github.repository }}
      with:
        [cite_start]host: ${{ secrets.DEPLOY_HOST }} [cite: 12]
        [cite_start]username: ${{ secrets.DEPLOY_USER }} [cite: 12]
        [cite_start]key: ${{ secrets.DEPLOY_SSH_KEY }} [cite: 12]
        envs: GOOGLE_DRIVE_FILE_ID, IMAGE_NAME_LC
        script: |
          set -e 
          
          # [FIX] Нормализуем имя образа прямо здесь, иначе pull упадет из-за больших букв
          IMAGE_LOWER=$(echo $IMAGE_NAME_LC | tr '[:upper:]' '[:lower:]')

          echo "Logging in to GHCR..."
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Pulling latest image..."
          # [FIX] Используем исправленную переменную IMAGE_LOWER
          [cite_start]docker pull ghcr.io/$IMAGE_LOWER:latest [cite: 13]

          echo "Preparing data directory..."
          [cite_start]mkdir -p /app/data [cite: 13]

          echo "Downloading CSV from Google Drive..."
          [cite_start]curl -L -o /app/data/df_final1.csv "https://drive.google.com/uc?export=download&id=${GOOGLE_DRIVE_FILE_ID}" [cite: 13]

          echo "Restarting application..."
          cd /app
          # [FIX] Оптимизированный перезапуск: удаляем лишнее и поднимаем заново
          [cite_start]docker compose down --remove-orphans || true [cite: 17]
          [cite_start]docker compose up -d [cite: 17]